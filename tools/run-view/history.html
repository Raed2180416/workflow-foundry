<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Read-only run history: past Foundry runs, their timelines and messages, a deterministic summary of what happened, and a comparison of two runs.">
<!--CSP-->
<title>Foundry run history</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="history.css">
</head>
<body>
<a class="skip-link" href="#view">Skip to the content</a>
<header class="bar">
  <div class="brand"><span class="mark" aria-hidden="true">W</span><span>Run history <small>read-only</small></span></div>
  <nav class="tabs" aria-label="Sections">
    <a id="nav-runs" href="#/runs">Runs</a>
    <a id="nav-tasks" href="#/tasks">Tasks and arms</a>
    <a id="nav-compare" href="#/compare" hidden>Compare</a>
  </nav>
  <div class="actions">
    <button id="open" type="button" class="btn">Open history file</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
    <button id="theme" type="button" class="btn">Light theme</button>
  </div>
</header>
<div id="source" class="source muted" role="note"></div>
<main id="view" tabindex="-1"><p class="empty">Loading the run history.</p></main>
<aside id="drawer" class="drawer" aria-label="Messages" hidden></aside>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<noscript><p class="empty">JavaScript is required to browse the run history.</p></noscript>
<!--DATA-->
<script src="history-core.js"></script>
<script src="history.js"></script>
</body>
</html>
