# Reference Docker Compose file for a Selenium Grid (synthetic stand-in for the docker-selenium project's file).
version: '3'
services:
  selenium-hub:
    image: selenium/hub:4.24.0-20250806
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
  edge:
    image: selenium/node-edge:4.26.0-20250920
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    ports:
      - "6901:5900"
  edge-legacy:
    image: selenium/node-edge:4.13.0-20250124
    shm_size: 2gb
  firefox:
    image: selenium/node-firefox:4.26.0-20250819
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    ports:
      - "6902:5900"
  chrome:
    image: selenium/node-chrome:4.25.0-20250816
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    ports:
      - "6900:5900"
  video:
    image: selenium/video:ffmpeg-7.1-20250909
    volumes:
      - ./videos:/videos
